{% if is_saved %}
<button hx-post="{% url 'unsave_job' job.id %}"
        hx-swap="outerHTML"
        class="flex items-center gap-1 text-red-500 hover:text-red-700 transition p-1"
        title="Remove from saved">
    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <span class="text-sm font-medium">Saved</span>
</button>
{% else %}
<button hx-post="{% url 'save_job' job.id %}"
        hx-swap="outerHTML"
        class="flex items-center gap-1 text-slate-500 hover:text-blue-600 transition p-1"
        title="Save job">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
    </svg>
    <span class="text-sm font-medium">Save</span>
</button>
{% endif %}
